name: Build Chinese Plugin

on:
  push:
    branches: [main, zh-cn]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: SDH-GameSync-zh-CN
          path: release/*.zip
          if-no-files-found: error
